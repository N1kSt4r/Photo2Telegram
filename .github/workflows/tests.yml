name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test images, projects, server and export
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Test browser logic
        run: node --test tests/test_preview_loader.cjs tests/test_post_drafts.cjs tests/test_telegram_ui.cjs

  video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and optional video tools
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Verify video tools
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Test including video previews
        run: python -m unittest discover -s tests -p "test_*.py" -v
